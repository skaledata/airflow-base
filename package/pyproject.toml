[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-provider-skaledata"
version = "0.4.1"
description = "SkaleData's Airflow extensions: drop-in replacements for upstream Airflow providers that talk to SkaleData-managed services. Imports live under the `skale.providers.*` namespace, mirroring Airflow's own provider layout."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SkaleData", email = "support@skaledata.com" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: Apache Airflow",
]
# Runtime deps. Airflow itself is supplied by the host environment (apache/airflow base image).
# The airbyte provider and SDK are pulled in here so this package is self-contained when
# pip-installed outside the SkaleData base image (e.g. from PyPI).
dependencies = [
  "apache-airflow-providers-airbyte",
  "airbyte-api",
]

[project.urls]
Homepage = "https://skaledata.com"
Source = "https://github.com/skaledata/airflow-base"
Issues = "https://github.com/skaledata/airflow-base/issues"

[project.entry-points."airflow.plugins"]
skale_airbyte = "skale.providers.airbyte.plugin:AirbytePlugin"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["skale"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
