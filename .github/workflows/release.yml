name: Release

# Builds and publishes two artifacts on every v* tag:
#
#   1. The base Docker image at GHCR (multi-arch, image-tagged by Airflow
#      version — not by the Python version, which is an internal build
#      pin and not a user choice).
#         ghcr.io/skaledata/airflow:<airflow-version>          (mutable)
#         ghcr.io/skaledata/airflow:<airflow-version>-<sha7>   (immutable)
#
#   2. The Python package on PyPI, published as airflow-provider-skaledata.
#      Uses PyPA Trusted Publishing (OIDC) — no API token to rotate.
#      Configure the trusted publisher on PyPI (first-time setup):
#        https://pypi.org/manage/account/publishing/ → "Add a pending publisher"
#        - PyPI Project Name: airflow-provider-skaledata
#        - Owner:             skaledata
#        - Repository name:   airflow-base
#        - Workflow name:     release.yml
#        (Leave environment name blank — we don't use one.)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/skaledata/airflow

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add new Airflow versions here. Python version baked in matches what
        # the SkaleData control plane's compat_loader.py points at.
        include:
          - airflow: "3.2.2"
            python: "3.12"

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          MUTABLE="${{ env.IMAGE }}:${{ matrix.airflow }}"
          IMMUTABLE="${{ env.IMAGE }}:${{ matrix.airflow }}-${SHA_SHORT}"
          {
            echo "mutable=${MUTABLE}"
            echo "immutable=${IMMUTABLE}"
          } >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Multi-arch so local dev on Apple Silicon works (`skale af start`
          # etc.). Customer clusters are all amd64 (GKE / EKS / AKS).
          platforms: linux/amd64,linux/arm64
          build-args: |
            AIRFLOW_VERSION=${{ matrix.airflow }}
            PYTHON_VERSION=${{ matrix.python }}
          tags: |
            ${{ steps.tags.outputs.mutable }}
            ${{ steps.tags.outputs.immutable }}
          cache-from: type=gha,scope=airflow-${{ matrix.airflow }}-py${{ matrix.python }}
          cache-to: type=gha,mode=max,scope=airflow-${{ matrix.airflow }}-py${{ matrix.python }}

  publish-pypi:
    name: Publish to PyPI
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPA Trusted Publishing (OIDC token exchange).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install --upgrade pip build

      - name: Build sdist + wheel
        working-directory: package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: package/dist
