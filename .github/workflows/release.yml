name: Release

# Builds and pushes the SkaleData Airflow base image to GHCR on every v* tag.
#
# Tag conventions:
#   v0.1.0                      — full matrix (every Airflow version in the matrix below)
#   v0.1.1-airflow3.2.1         — single-target rebuild without rev-bumping plugin
#
# Image tags published per Airflow target on each release. The Python version
# is an internal build-time pin (currently 3.12) and intentionally not part of
# the customer-facing tag — we don't offer Python as a user choice.
#   ghcr.io/skaledata/airflow:<airflow-version>          (mutable, latest plugin)
#   ghcr.io/skaledata/airflow:<airflow-version>-<sha7>   (immutable per build)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/skaledata/airflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add new Airflow versions here. Python version baked in matches what
        # the SkaleData control plane's compat_loader.py points at.
        include:
          - airflow: "3.2.2"
            python: "3.12"

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          MUTABLE="${{ env.IMAGE }}:${{ matrix.airflow }}"
          IMMUTABLE="${{ env.IMAGE }}:${{ matrix.airflow }}-${SHA_SHORT}"
          {
            echo "mutable=${MUTABLE}"
            echo "immutable=${IMMUTABLE}"
          } >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Multi-arch so local dev on Apple Silicon works (`skale af start`
          # etc.). Customer clusters are all amd64 (GKE / EKS / AKS).
          platforms: linux/amd64,linux/arm64
          build-args: |
            AIRFLOW_VERSION=${{ matrix.airflow }}
            PYTHON_VERSION=${{ matrix.python }}
          tags: |
            ${{ steps.tags.outputs.mutable }}
            ${{ steps.tags.outputs.immutable }}
          cache-from: type=gha,scope=airflow-${{ matrix.airflow }}-py${{ matrix.python }}
          cache-to: type=gha,mode=max,scope=airflow-${{ matrix.airflow }}-py${{ matrix.python }}
