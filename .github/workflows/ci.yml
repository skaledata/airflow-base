name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        working-directory: package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        working-directory: package
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        working-directory: package
        run: pytest -v

  dockerfile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      # Build the base image and load it into the local docker daemon so the
      # downstream test below can reference it by tag.
      - name: Build base image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: skaledata-airflow-base:test
          platforms: linux/amd64
          build-args: |
            AIRFLOW_VERSION=3.2.2
            PYTHON_VERSION=3.12
          cache-from: type=gha,scope=airflow-3.2.2-py3.12
          cache-to: type=gha,mode=max,scope=airflow-3.2.2-py3.12

      # Verify ONBUILD triggers actually pick up packages.txt + requirements.txt.
      # The fixture has packages.txt=jq and requirements.txt=requests; if either
      # ONBUILD step misbehaves, the downstream verification below catches it.
      - name: Build downstream image (exercises ONBUILD)
        run: |
          docker build \
            --build-arg BASE_IMAGE=skaledata-airflow-base:test \
            -t skaledata-airflow-base:downstream-test \
            tests/onbuild-fixture

      # Use --entrypoint /bin/bash to bypass the apache/airflow image's
      # smart entrypoint, which intercepts unknown first-args and prints
      # `airflow --help` instead of running them.
      - name: Verify packages.txt was installed via apt (jq)
        run: docker run --rm --entrypoint /bin/bash skaledata-airflow-base:downstream-test -c "jq --version"

      - name: Verify requirements.txt was installed via pip (requests)
        run: docker run --rm --entrypoint /bin/bash skaledata-airflow-base:downstream-test -c "python -c 'import requests; print(\"requests\", requests.__version__)'"

      - name: Verify skale-airflow-plugins is still importable
        run: docker run --rm --entrypoint /bin/bash skaledata-airflow-base:downstream-test -c "python -c 'from skale.providers.airbyte.hooks.airbyte import AirbyteHook; print(\"plugin ok\")'"

      - name: Verify default webserver_config.py is present
        run: docker run --rm --entrypoint /bin/bash skaledata-airflow-base:downstream-test -c "grep -q 'AUTH_ROLE_PUBLIC.*Admin' /opt/airflow/webserver_config.py && echo 'webserver_config ok'"
