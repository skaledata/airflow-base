name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        working-directory: package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        working-directory: package
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        working-directory: package
        run: pytest -v

  dockerfile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            AIRFLOW_VERSION=3.2.1
            PYTHON_VERSION=3.12
          cache-from: type=gha,scope=airflow-3.2.1-py3.12
          cache-to: type=gha,mode=max,scope=airflow-3.2.1-py3.12
